
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Livros</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f3;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #247a50;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #247a50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .mensagem {
            color: #247a50;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>LivroFácil Escolar</h1>

    <h2>Cadastro de livros</h2>

    <p class="mensagem">{{ mensagem }}</p>

    <form action="/livros/cadastrar" method="POST">

        <label>Título do livro:</label>
        <input type="text" name="titulo" required>

        <label>Autor:</label>
        <input type="text" name="autor" required>

        <label>Quantidade de exemplares:</label>
        <input type="number" name="quantidade"
        min="1" required>

        <label>Números TOMBO:</label>
        <input
            type="text"
            name="tombos"
            placeholder="Exemplo: 0001, 0002, 0003"
            required
        >

        <p style="font-size: 13px; color: #666;">
         Informe um TOMBO de 4 números para cada exemplar,
        separados por vírgula.
        </p>

        <button type="submit">Cadastrar livro</button>

    </form>

    <p>
        <a href="/">Voltar ao início</a>
    </p>

</div>

</body>
</html>
